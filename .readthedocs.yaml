# Read the Docs configuration (https://docs.readthedocs.io/en/stable/config-file/v2.html).
# Dependencies are installed with uv from pyproject.toml: the package's `api` extra (so that
# autodoc can import the code) plus the `sphinx-docs` dependency group (Sphinx, Furo, MyST, ...).
# The existing `docs` extra belongs to the Manubot manuscript build and is not used here.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --extra api --group sphinx-docs

sphinx:
  configuration: docs/conf.py
