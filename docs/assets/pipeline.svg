<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Pipeline from data to randomised pilot decision">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <style>
      .t{font-family:Segoe UI,Helvetica,Arial,sans-serif}
      .h{font-size:15px;font-weight:700;fill:#0f172a}
      .s{font-size:12px;fill:#334155}
      .l{font-size:12px;font-weight:700;fill:#475569;letter-spacing:2px}
    </style>
  </defs>
  <rect width="1200" height="520" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="40" y="44" class="t" font-size="22" font-weight="700" fill="#0f172a">How the project works — from raw data to a business decision</text>

  <!-- Lane labels -->
  <text x="40" y="92" class="t l">1 · MODEL</text>
  <text x="40" y="262" class="t l">2 · ECONOMICS &amp; EXPERIMENT</text>
  <text x="40" y="432" class="t l">3 · SERVE &amp; REPORT</text>

  <!-- Lane 1 -->
  <g class="t">
    <rect x="40" y="105" width="190" height="90" rx="12" fill="#e0f2fe" stroke="#38bdf8"/>
    <text x="135" y="134" text-anchor="middle" class="h">Client.csv + Record.csv</text>
    <text x="135" y="155" text-anchor="middle" class="s">100,000 customers · 1:1 join</text>
    <text x="135" y="173" text-anchor="middle" class="s">validate → 97 features</text>

    <rect x="280" y="105" width="190" height="90" rx="12" fill="#ede9fe" stroke="#a78bfa"/>
    <text x="375" y="134" text-anchor="middle" class="h">Feature pipeline</text>
    <text x="375" y="155" text-anchor="middle" class="s">drop Customer_ID, ethnic</text>
    <text x="375" y="173" text-anchor="middle" class="s">missing values allowed</text>

    <rect x="520" y="105" width="190" height="90" rx="12" fill="#ede9fe" stroke="#a78bfa"/>
    <text x="615" y="134" text-anchor="middle" class="h">HistGradientBoosting</text>
    <text x="615" y="155" text-anchor="middle" class="s">+ Platt calibration</text>
    <text x="615" y="173" text-anchor="middle" class="s">test ROC-AUC 0.693</text>

    <rect x="760" y="105" width="190" height="90" rx="12" fill="#ede9fe" stroke="#a78bfa"/>
    <text x="855" y="134" text-anchor="middle" class="h">Base-rate adjustment</text>
    <text x="855" y="155" text-anchor="middle" class="s">49.6% sample → ~1% assumed</text>
    <text x="855" y="173" text-anchor="middle" class="s">odds shift, not measured</text>

    <rect x="990" y="105" width="170" height="90" rx="12" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="1075" y="134" text-anchor="middle" class="h">Risk ranking</text>
    <text x="1075" y="155" text-anchor="middle" class="s">top 5% ≈ 5.3× average</text>
    <text x="1075" y="173" text-anchor="middle" class="s">association only</text>
  </g>
  <g stroke="#64748b" stroke-width="2" marker-end="url(#arr)">
    <path d="M230 150H274"/><path d="M470 150H514"/><path d="M710 150H754"/><path d="M950 150H984"/>
  </g>

  <!-- Lane 2 -->
  <g class="t">
    <rect x="990" y="275" width="170" height="90" rx="12" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="1075" y="304" text-anchor="middle" class="h">Break-even economics</text>
    <text x="1075" y="325" text-anchor="middle" class="s">$0.75 contact → 6.4% save</text>
    <text x="1075" y="343" text-anchor="middle" class="s">$20 credit → 32% save</text>

    <rect x="760" y="275" width="190" height="90" rx="12" fill="#dcfce7" stroke="#4ade80"/>
    <text x="855" y="304" text-anchor="middle" class="h">Pilot sizing</text>
    <text x="855" y="325" text-anchor="middle" class="s">two-arm randomised test</text>
    <text x="855" y="343" text-anchor="middle" class="s">baseline churn × effect</text>

    <rect x="520" y="275" width="190" height="90" rx="12" fill="#dcfce7" stroke="#4ade80"/>
    <text x="615" y="304" text-anchor="middle" class="h">Capped pilot + holdout</text>
    <text x="615" y="325" text-anchor="middle" class="s">treat vs control</text>
    <text x="615" y="343" text-anchor="middle" class="s">pre-agreed stop rule</text>

    <rect x="280" y="275" width="190" height="90" rx="12" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
    <text x="375" y="304" text-anchor="middle" class="h">Decision</text>
    <text x="375" y="325" text-anchor="middle" class="s">scale only if incremental</text>
    <text x="375" y="343" text-anchor="middle" class="s">saves beat break-even</text>
  </g>
  <path d="M1075 195V268" stroke="#64748b" stroke-width="2" marker-end="url(#arr)" fill="none"/>
  <g stroke="#64748b" stroke-width="2" marker-end="url(#arr)">
    <path d="M990 320H956"/><path d="M760 320H716"/><path d="M520 320H476"/>
  </g>

  <!-- Lane 3 -->
  <g class="t">
    <rect x="40" y="445" width="260" height="56" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="170" y="469" text-anchor="middle" class="h">FastAPI service</text>
    <text x="170" y="488" text-anchor="middle" class="s">/score · /finance · /pilot</text>

    <rect x="340" y="445" width="260" height="56" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="470" y="469" text-anchor="middle" class="h">Neo4j cohorts (optional)</text>
    <text x="470" y="488" text-anchor="middle" class="s">exploration, parity with pandas</text>

    <rect x="640" y="445" width="260" height="56" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="770" y="469" text-anchor="middle" class="h">Simulation layer</text>
    <text x="770" y="488" text-anchor="middle" class="s">YAML scenarios · MiroFish adapter</text>

    <rect x="940" y="445" width="220" height="56" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="1050" y="469" text-anchor="middle" class="h">Manubot manuscript</text>
    <text x="1050" y="488" text-anchor="middle" class="s">reproducible report</text>
  </g>
</svg>
