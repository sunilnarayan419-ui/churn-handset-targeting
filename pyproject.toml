[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-targeting"
version = "0.1.0"
description = "Handset-age churn targeting for a telecom retention pilot: model, break-even economics, API and graph analytics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SunilMandloi" }]
dependencies = ["numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "joblib>=1.3"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.5"]
graph = ["neo4j>=5.20"]
notebook = ["matplotlib>=3.8", "seaborn>=0.13", "scipy>=1.11", "jupyter"]
docs = ["manubot", "jinja2>=3.1", "pyyaml>=6"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5", "pre-commit>=3"]

[project.scripts]
churn-targeting = "churn_targeting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs a running Neo4j (set NEO4J_URI, NEO4J_USER, NEO4J_PASSWORD)"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]   # long lines are tolerated in tables and docstrings

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

# Sphinx documentation site (docs/). Kept separate from the `docs` extra, which builds the Manubot manuscript.
# httpx and pyyaml are imported by churn_targeting.cli / churn_targeting.simulation, which autodoc imports.
[dependency-groups]
sphinx-docs = [
    "sphinx>=7.3,<9",
    "furo>=2024.8.6",
    "myst-parser>=3.0,<5",
    "sphinx-autodoc-typehints>=2.2,<4",
    "sphinxcontrib-mermaid>=0.9.2,<3",
    "httpx>=0.27",
    "pyyaml>=6",
]
